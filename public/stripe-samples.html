<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stripe Light Samples</title>
  <style>
    body {
      background: #F8F8F6;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .label {
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Common Card Styles */
    .card {
      width: 300px;
      background: #fff;
      padding: 16px;
      border-radius: 2px;
      box-shadow: 6px 6px 0px #000;
      position: relative;
    }
    
    .card-inner {
      background: #fff;
      padding: 16px;
      border: 1px solid #000;
    }

    /* =========================================
       1. Diagonal Hazard (Current)
       ========================================= */
    .style-1 {
      padding: 4px;
      background: repeating-linear-gradient(
        45deg,
        #000,
        #000 10px,
        #84CC16 10px,
        #84CC16 20px
      );
      background-size: 28px 28px;
      animation: move1 1s linear infinite;
    }
    @keyframes move1 {
      0% { background-position: 0 0; }
      100% { background-position: 28px 0; }
    }

    /* =========================================
       2. Retro Marquee (Vertical stripes moving horizontally)
       ========================================= */
    .style-2 {
      padding: 4px;
      background: repeating-linear-gradient(
        90deg,
        #000,
        #000 10px,
        #84CC16 10px,
        #84CC16 20px
      );
      background-size: 20px 100%;
      animation: move2 0.8s linear infinite;
    }
    @keyframes move2 {
      0% { background-position: 0 0; }
      100% { background-position: 20px 0; }
    }

    /* =========================================
       3. RGB Smooth Glow (Rotating Gradient)
       ========================================= */
    .style-3 {
      padding: 4px;
      background: linear-gradient(90deg, #84CC16, #D9F99D, #84CC16, #000, #84CC16);
      background-size: 400% 100%;
      animation: move3 3s linear infinite;
    }
    @keyframes move3 {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* =========================================
       4. Marching Ants (Dashed outline)
       ========================================= */
    .style-4 {
      padding: 4px;
      background: #fff;
      /* Using a background trick for marching ants */
      background-image: 
        linear-gradient(90deg, #000 50%, transparent 50%),
        linear-gradient(90deg, #000 50%, transparent 50%),
        linear-gradient(0deg, #000 50%, transparent 50%),
        linear-gradient(0deg, #000 50%, transparent 50%);
      background-repeat: repeat-x, repeat-x, repeat-y, repeat-y;
      background-size: 16px 4px, 16px 4px, 4px 16px, 4px 16px;
      background-position: 0 0, 100% 100%, 0 100%, 100% 0;
      animation: move4 0.5s linear infinite;
    }
    .style-4 .card-inner {
      border: none;
    }
    @keyframes move4 {
      0% {
        background-position: 0 0, 100% 100%, 0 100%, 100% 0;
      }
      100% {
        background-position: 16px 0, -16px 100%, 0 -16px, 100% 16px;
      }
    }

  </style>
</head>
<body>

  <div class="card-wrapper">
    <div class="label">1. Diagonal Hazard (Current)</div>
    <div class="card style-1">
      <div class="card-inner">
        <strong>UPCOMING EVENTS</strong><br>
        Next in queue.
      </div>
    </div>
  </div>

  <div class="card-wrapper">
    <div class="label">2. Retro Marquee</div>
    <div class="card style-2">
      <div class="card-inner">
        <strong>UPCOMING EVENTS</strong><br>
        Next in queue.
      </div>
    </div>
  </div>

  <div class="card-wrapper">
    <div class="label">3. Smooth LED Glow</div>
    <div class="card style-3">
      <div class="card-inner">
        <strong>UPCOMING EVENTS</strong><br>
        Next in queue.
      </div>
    </div>
  </div>

  <div class="card-wrapper">
    <div class="label">4. Marching Ants</div>
    <div class="card style-4">
      <div class="card-inner">
        <strong>UPCOMING EVENTS</strong><br>
        Next in queue.
      </div>
    </div>
  </div>

</body>
</html>
